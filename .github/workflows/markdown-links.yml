name: Check Markdown Links

on:
  pull_request:
    branches:
      - master
      - develop
      - 'feat/**'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225 # v1.1.2
      with:
        folder-path: 'docs'
